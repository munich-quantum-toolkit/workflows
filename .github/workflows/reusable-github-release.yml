name: 🚀 • GitHub Release
on:
  workflow_call:
    inputs:
      version:
        description: "The stable release version without the v prefix"
        required: true
        type: string
      release-name:
        description: "The title of the GitHub release"
        required: true
        type: string
      artifacts-pattern:
        description: "The artifact name pattern containing C++ archives"
        default: "cpp-archives-*"
        type: string
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  publish:
    name: 🚀 Publish to GitHub
    permissions:
      contents: write # Needed to inspect drafts and generate release notes
    runs-on: ubuntu-slim
    env:
      RELEASE_TAG: v${{ inputs.version }}
    steps:
      - name: Check release
        id: existing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v[0-9]+[.][0-9]+[.][0-9]+$/.test(tag)) {
              throw new Error('version must be a stable X.Y.Z release.');
            }
            try {
              const { data: commit } = await github.rest.repos.getCommit({
                ...context.repo,
                ref: `refs/tags/${tag}`,
              });
              if (commit.sha !== context.sha) {
                throw new Error('Release tag points to a different commit.');
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const release = releases.find(release => release.tag_name === tag);
            if (release && !release.draft) return true;
            core.setOutput('release-id', release?.id ?? '');
            return false;

      - name: Prepare release notes
        id: notes
        if: steps.existing.outputs.result != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            let previous;
            try {
              ({ data: previous } = await github.rest.repos.getLatestRelease(context.repo));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              previous_tag_name: previous?.tag_name,
            });
            const contributors = notes.body
              .split('## New Contributors\n')[1]
              ?.split('\n**Full Changelog**:')[0].trim();
            core.setOutput('new-contributors', contributors || '');
            const repositoryUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            core.setOutput('changes-url', previous
              ? `${repositoryUrl}/compare/${previous.tag_name}...${tag}`
              : `${repositoryUrl}/commits/${tag}`
            );

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.existing.outputs.result != 'true'
        with:
          pattern: ${{ inputs.artifacts-pattern }}
          path: dist
          merge-multiple: true

      - name: Generate checksums
        if: steps.existing.outputs.result != 'true'
        run: cd dist && sha256sum -- *.tar.gz > SHA256SUMS

      - name: Create release token
        if: steps.existing.outputs.result != 'true'
        id: create-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-workflows: write

      - name: Attach archives and publish
        if: steps.existing.outputs.result != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.existing.outputs.release-id }}
          RELEASE_NAME: ${{ inputs.release-name }}
          RELEASE_BODY: |
            ## 👀 What Changed

            _Please refer to the [changelog](https://github.com/${{ github.repository }}/blob/${{ env.RELEASE_TAG }}/CHANGELOG.md) for a structured overview of the changes._

            ${{ steps.notes.outputs.new-contributors && '## 🤝 New Contributors' || '' }}

            ${{ steps.notes.outputs.new-contributors }}

            **Full Changelog**: ${{ steps.notes.outputs.changes-url }}
        with:
          github-token: ${{ steps.create-token.outputs.token }}
          retries: 3
          script: |
            const fs = require('node:fs');
            const files = fs.readdirSync('dist').filter(name =>
              name.endsWith('.tar.gz') || name === 'SHA256SUMS'
            );
            if (!files.includes('SHA256SUMS') || !files.some(name => name.endsWith('.tar.gz'))) {
              throw new Error('Release requires C++ archives and SHA256SUMS.');
            }
            const parameters = {
              ...context.repo,
              tag_name: process.env.RELEASE_TAG,
              target_commitish: context.sha,
              name: process.env.RELEASE_NAME,
              body: process.env.RELEASE_BODY,
              draft: true,
            };
            const releaseId = Number(process.env.RELEASE_ID);
            const { data: release } = releaseId
              ? await github.rest.repos.updateRelease({ ...parameters, release_id: releaseId })
              : await github.rest.repos.createRelease(parameters);
            for (const name of files) {
              const existing = release.assets.find(asset => asset.name === name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: existing.id });
              }
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: release.id,
                name,
                data: fs.readFileSync(`dist/${name}`),
                headers: { 'content-type': name.endsWith('.tar.gz') ? 'application/gzip' : 'text/plain' },
              });
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false });
