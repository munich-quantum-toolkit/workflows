name: 🚀 • GitHub Release
on:
  workflow_call:
    inputs:
      version:
        description: "The stable release version without the v prefix"
        required: true
        type: string
      previous-version:
        description: "Previous stable version without the v prefix. Defaults to the latest published release."
        type: string
      release-name:
        description: "The title of the GitHub release"
        required: true
        type: string
      has-changelog:
        description: "Whether to link to CHANGELOG.md instead of listing every change"
        default: true
        type: boolean
      has-upgrade-guide:
        description: "Whether to also link to UPGRADING.md when a changelog is available"
        default: false
        type: boolean
    secrets:
      RELEASE_TOKEN:
        description: "Optional release token with additional permissions. Defaults to GITHUB_TOKEN."
        required: false

permissions: {}

jobs:
  publish:
    name: 🚀 Publish to GitHub
    permissions:
      contents: write # Needed to create releases and tags
    runs-on: ubuntu-slim
    env:
      RELEASE_TAG: v${{ inputs.version }}
    steps:
      - name: Check release
        id: existing
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^v[0-9]+[.][0-9]+[.][0-9]+$/.test(tag)) {
              throw new Error('version must be a stable X.Y.Z release.');
            }
            const ref = `refs/tags/${tag}`;
            const { data: refs } = await github.rest.git.listMatchingRefs({
              ...context.repo,
              ref: `tags/${tag}`,
            });
            if (refs.some(candidate => candidate.ref === ref)) {
              const { data: commit } = await github.rest.repos.getCommit({
                ...context.repo,
                ref,
              });
              if (commit.sha !== context.sha) {
                throw new Error('Release tag points to a different commit.');
              }
            }
            const releases = await github.paginate(github.rest.repos.listReleases, context.repo);
            const release = releases.find(release => release.tag_name === tag);
            if (release && !release.draft) return true;
            core.setOutput('release-id', release?.id ?? '');
            return false;

      - name: Generate release notes
        id: notes
        if: steps.existing.outputs.result != 'true'
        env:
          PREVIOUS_VERSION: ${{ inputs.previous-version }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          result-encoding: string
          script: |
            const tag = process.env.RELEASE_TAG;
            let previousTag;
            if (process.env.PREVIOUS_VERSION) {
              if (!/^[0-9]+[.][0-9]+[.][0-9]+$/.test(process.env.PREVIOUS_VERSION)) {
                throw new Error('previous-version must be a stable X.Y.Z release.');
              }
              previousTag = `v${process.env.PREVIOUS_VERSION}`;
            } else {
              try {
                const { data } = await github.rest.repos.getLatestRelease(context.repo);
                previousTag = data.tag_name;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            const { data: notes } = await github.rest.repos.generateReleaseNotes({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              previous_tag_name: previousTag,
            });
            const repositoryUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            core.setOutput('changes-url', previousTag
              ? `${repositoryUrl}/compare/${previousTag}...${tag}`
              : `${repositoryUrl}/commits/${tag}`
            );
            return notes.body;

      - name: Extract new contributors
        id: contributors
        if: steps.existing.outputs.result != 'true' && inputs.has-changelog
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_NOTES: ${{ steps.notes.outputs.result }}
        with:
          result-encoding: string
          script: |
            return process.env.RELEASE_NOTES
              .split('## New Contributors\n')[1]
              ?.split('\n**Full Changelog**:')[0].trim() || '';

      - name: Build release body
        id: body
        if: steps.existing.outputs.result != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HAS_CHANGELOG: ${{ inputs.has-changelog }}
          HAS_UPGRADE_GUIDE: ${{ inputs.has-upgrade-guide }}
          RELEASE_NOTES: ${{ steps.notes.outputs.result }}
          NEW_CONTRIBUTORS: ${{ steps.contributors.outputs.result }}
          CHANGES_URL: ${{ steps.notes.outputs.changes-url }}
        with:
          result-encoding: string
          script: |
            if (process.env.HAS_CHANGELOG !== 'true') return process.env.RELEASE_NOTES;
            const repositoryUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;
            const base = `${repositoryUrl}/blob/${process.env.RELEASE_TAG}`;
            const guides = `[changelog](${base}/CHANGELOG.md)` + (
              process.env.HAS_UPGRADE_GUIDE === 'true'
                ? ` and the [upgrade guide](${base}/UPGRADING.md)` : ''
            );
            const contributors = process.env.NEW_CONTRIBUTORS;
            return [
              '## 👀 What Changed',
              `_Please refer to the ${guides} for a structured overview of the changes._`,
              contributors ? `## 🤝 New Contributors\n\n${contributors}` : '',
              `**Full Changelog**: ${process.env.CHANGES_URL}`,
            ].filter(Boolean).join('\n\n');

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.existing.outputs.result != 'true'
        with:
          pattern: cpp-archives-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        if: steps.existing.outputs.result != 'true'
        run: |
          if compgen -G 'dist/*.tar.gz' > /dev/null; then
            (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          fi

      - name: Publish release
        if: steps.existing.outputs.result != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_ID: ${{ steps.existing.outputs.release-id }}
          RELEASE_NAME: ${{ inputs.release-name }}
          RELEASE_BODY: ${{ steps.body.outputs.result }}
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || github.token }}
          retries: 3
          script: |
            const fs = require('node:fs');
            const files = (fs.existsSync('dist') ? fs.readdirSync('dist') : []).filter(name =>
              name.endsWith('.tar.gz') || name === 'SHA256SUMS'
            );
            if (files.length && (!files.includes('SHA256SUMS') || !files.some(name => name.endsWith('.tar.gz')))) {
              throw new Error('Archive assets require .tar.gz files and SHA256SUMS.');
            }
            const parameters = {
              ...context.repo,
              tag_name: process.env.RELEASE_TAG,
              target_commitish: context.sha,
              name: process.env.RELEASE_NAME,
              body: process.env.RELEASE_BODY,
              draft: true,
            };
            const releaseId = Number(process.env.RELEASE_ID);
            const { data: release } = releaseId
              ? await github.rest.repos.updateRelease({ ...parameters, release_id: releaseId })
              : await github.rest.repos.createRelease(parameters);
            for (const name of files) {
              const existing = release.assets.find(asset => asset.name === name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: existing.id });
              }
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo,
                release_id: release.id,
                name,
                data: fs.readFileSync(`dist/${name}`),
                headers: { 'content-type': name.endsWith('.tar.gz') ? 'application/gzip' : 'text/plain' },
              });
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id: release.id, draft: false });
