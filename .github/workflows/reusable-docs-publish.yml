name: 📚 • Publish documentation
on:
  workflow_call:
    inputs:
      project-slug:
        description: Read the Docs project slug with direct upload enabled
        type: string
        required: true
      build-workflows:
        description: Whitespace-separated caller workflow paths allowed to produce docs
        type: string
        default: .github/workflows/ci.yml
    secrets:
      READTHEDOCS_TOKEN:
        description: Read the Docs API token for the project
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}-docs-publish
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: 📚 Publish
    if: >-
      github.event_name == 'workflow_run' &&
      contains(fromJSON('["push", "pull_request"]'), github.event.workflow_run.event)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      actions: read # Download the triggering run's artifact
      contents: read
      pull-requests: read # Verify the current preview source
    steps:
      - name: Select the current documentation artifact
        id: target
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          BUILD_WORKFLOWS: ${{ inputs.build-workflows }}
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!process.env.BUILD_WORKFLOWS.split(/\s+/).includes(run.path))
              throw new Error('Unexpected source workflow');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo, run_id: run.id, per_page: 100,
            });
            const candidates = artifacts.filter(a => !a.expired && /^docs-(?:[1-9]\d*|branch|tag)$/.test(a.name));
            if (!candidates.length) return;
            if (candidates.length !== 1) throw new Error('Ambiguous docs artifacts');
            const name = candidates[0].name;
            let type = name.slice('docs-'.length);
            let version = run.head_branch;
            if (run.event === 'pull_request') {
              if (!/^[1-9]\d*$/.test(type)) throw new Error('Expected a PR preview');
              version = type;
              type = 'external';
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(version) });
              if (pr.state !== 'open' || pr.head.sha !== run.head_sha ||
                  pr.head.repo?.id !== run.head_repository.id || pr.head.ref !== run.head_branch) return;
            } else {
              if (!(type === 'branch' && version === context.payload.repository.default_branch ||
                    type === 'tag' && version.startsWith('v'))) return;
              const ref = `refs/${type === 'tag' ? 'tags' : 'heads'}/${version}`;
              const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref });
              if (commit.sha !== run.head_sha) return;
            }
            core.setOutput('id', candidates[0].id);
            core.setOutput('version', version);
            core.setOutput('type', type);
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.target.outputs.id
        with:
          artifact-ids: ${{ steps.target.outputs.id }}
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: html
      - name: Prepare offline documentation
        if: steps.target.outputs.id
        working-directory: html
        run: |
          test -z "$(find . -type l -print -quit)"
          zip -qr "$RUNNER_TEMP/html.zip" .
      - uses: readthedocs/upload-action@80f3c6547919b97858e61ffbe3a4990a25959f9a # v1
        if: steps.target.outputs.id
        with:
          token: ${{ secrets.READTHEDOCS_TOKEN }}
          project-slug: ${{ inputs.project-slug }}
          html: html
          htmlzip: ${{ runner.temp }}/html.zip
          version-name: ${{ steps.target.outputs.version }}
          version-type: ${{ steps.target.outputs.type }}
          commit: ${{ github.event.workflow_run.head_sha }}
