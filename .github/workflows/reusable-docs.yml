name: 📚 • Documentation
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for the docs session
        type: string
        default: "3.14"
      apt-packages:
        description: Whitespace-separated APT packages needed by the docs
        type: string
        default: ""
      preview-version-variable:
        description: Package-specific pretend-version environment variable for shallow PR builds
        type: string
        default: ""

permissions:
  contents: read

jobs:
  docs:
    name: 📚 Build
    # PR code must never run in a privileged caller context.
    if: contains(fromJSON('["push", "pull_request", "merge_group", "workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_SKIP_CACHE_CHECK: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: ${{ github.event_name == 'pull_request' && inputs.preview-version-variable != '' && '1' || '0' }}
          filter: blob:none
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
          save-cache: false
      - name: Install additional APT packages
        if: inputs.apt-packages != ''
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          read -r -a packages <<< "${APT_PACKAGES//$'\n'/ }"
          sudo apt-get update
          sudo apt-get install -y -- "${packages[@]}"
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      # PR caches cannot be restored by main; only main writes shared compiler entries.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Set the PR preview version
        if: github.event_name == 'pull_request' && inputs.preview-version-variable != ''
        env:
          VARIABLE: ${{ inputs.preview-version-variable }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$VARIABLE=0.0.0.dev$PR_NUMBER" >> "$GITHUB_ENV"
      - name: Build and validate documentation
        run: |
          uvx nox --non-interactive -s docs
          test -f docs/_build/html/index.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: contains(fromJSON('["pull_request", "push"]'), github.event_name)
        with:
          name: docs-${{ github.event.pull_request.number || github.ref_type }}
          path: docs/_build/html
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
