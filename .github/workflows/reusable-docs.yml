name: 📚 • Documentation
on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for the docs session
        type: string
        default: "3.14"
      apt-packages:
        description: Whitespace-separated APT packages needed by the docs
        type: string
        default: ""
      project-slug:
        description: Read the Docs project slug (optional with a project token)
        type: string
      build-workflows:
        description: JSON array of trusted caller workflow paths that produce docs
        type: string
        default: '[".github/workflows/ci.yml"]'
    secrets:
      READTHEDOCS_TOKEN:
        description: Read the Docs upload token for the workflow_run caller
        required: false

permissions: {}

jobs:
  docs:
    name: 📚 Build
    # PR code must never run in a privileged caller context.
    if: contains(fromJSON('["push", "pull_request", "merge_group", "workflow_dispatch"]'), github.event_name)
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "4"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IDLE_TIMEOUT: "0"
      SCCACHE_SKIP_CACHE_CHECK: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          filter: blob:none
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ inputs.python-version }}
          save-cache: false
      - name: Install additional APT packages
        if: inputs.apt-packages != ''
        uses: $/.github/actions/install-apt-packages
        with:
          packages: ${{ inputs.apt-packages }}
      - uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1
      # PR caches cannot be restored by main; only main writes shared compiler entries.
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Tag the shallow checkout for PR versioning
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git update-ref "refs/tags/v0.0.0.dev$PR_NUMBER" HEAD
      - name: Build and validate documentation
        env:
          TARGET: ${{ github.event.pull_request.number || github.ref_type }}
        run: |
          uvx nox --non-interactive -s docs
          test -f docs/_build/html/index.html
          echo "$TARGET" > docs/_build/target
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: contains(fromJSON('["pull_request", "push"]'), github.event_name)
        with:
          name: docs
          path: |
            docs/_build/html
            docs/_build/target
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error

  publish:
    name: 📚 Publish
    permissions:
      actions: read # Download the docs artifact
      contents: read
      pull-requests: read # Verify the preview commit
    if: >-
      github.event_name == 'workflow_run' &&
      contains(fromJSON('["push", "pull_request"]'), github.event.workflow_run.event)
    concurrency:
      # Pushes share publication names across tags. PR previews can publish independently.
      group: ${{ github.workflow }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.event == 'pull_request' && format('pr-{0}', github.event.workflow_run.head_branch) || 'push' }}-docs-publish
      queue: max
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # A run where change detection skipped docs has no matching artifact.
          pattern: docs
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: site
      - name: Verify the current publication target
        id: target
        env:
          BUILD_WORKFLOWS: ${{ inputs.build-workflows }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const fs = require('node:fs');
            if (!JSON.parse(process.env.BUILD_WORKFLOWS).includes(run.path) || !fs.existsSync('site')) return;
            const marker = fs.lstatSync('site/target');
            if (!marker.isFile() || marker.size > 24) throw new Error('Invalid docs target');
            let type = fs.readFileSync('site/target', 'utf8').trim();
            let version = run.head_branch;
            if (run.event === 'pull_request') {
              if (!/^[1-9]\d*$/.test(type)) throw new Error('Expected a PR preview');
              version = type;
              type = 'external';
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: Number(version) });
              if (pr.state !== 'open' || pr.head.sha !== run.head_sha ||
                  !pr.head.repo || pr.head.repo.id !== run.head_repository?.id || pr.head.ref !== run.head_branch) return;
            } else {
              if (!(type === 'branch' && version === context.payload.repository.default_branch ||
                    type === 'tag' && version.startsWith('v'))) return;
              const ref = `refs/${type === 'tag' ? 'tags' : 'heads'}/${version}`;
              const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref });
              if (commit.sha !== run.head_sha) return;
              if (type === 'tag') {
                const { data: refs } = await github.rest.git.listMatchingRefs({ ...context.repo, ref: 'tags/v' });
                const releases = refs.map(({ ref }) => ref.slice('refs/tags/'.length))
                  .filter(tag => /^v(?:0|[1-9]\d*)(?:\.(?:0|[1-9]\d*)){2}$/.test(tag));
                const newest = releases.sort(new Intl.Collator('en', { numeric: true }).compare).at(-1);
                if (version === newest) core.setOutput('stable', true);
              }
            }
            core.setOutput('version', type === 'branch' ? 'latest' : version);
            core.setOutput('type', type);
      - name: Prepare offline documentation
        if: steps.target.outputs.version
        run: |
          test -z "$(find site -type l -print -quit)"
          test -f site/html/index.html
          cd site/html
          zip -qr "$RUNNER_TEMP/html.zip" .
      - uses: readthedocs/upload-action@80f3c6547919b97858e61ffbe3a4990a25959f9a # v1
        if: steps.target.outputs.version
        with:
          token: ${{ secrets.READTHEDOCS_TOKEN }}
          project-slug: ${{ inputs.project-slug }}
          html: site/html
          htmlzip: ${{ runner.temp }}/html.zip
          version-name: ${{ steps.target.outputs.version }}
          version-type: ${{ steps.target.outputs.type }}
          commit: ${{ github.event.workflow_run.head_sha }}
      - name: Publish stable
        if: steps.target.outputs.stable
        uses: readthedocs/upload-action@80f3c6547919b97858e61ffbe3a4990a25959f9a # v1
        with:
          token: ${{ secrets.READTHEDOCS_TOKEN }}
          project-slug: ${{ inputs.project-slug }}
          html: site/html
          htmlzip: ${{ runner.temp }}/html.zip
          version-name: stable
          version-type: ${{ steps.target.outputs.type }}
          commit: ${{ github.event.workflow_run.head_sha }}
