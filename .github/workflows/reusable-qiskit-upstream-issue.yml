name: 🐍⚛️ Qiskit Upstream Tests
on:
  workflow_call:
    inputs:
      tests-result:
        description: "The result of the Qiskit upstream tests"
        required: true
        type: string

permissions: {}

jobs:
  create-issue:
    uses: $/.github/workflows/reusable-upstream-issue.yml
    with:
      tests-result: ${{ inputs.tests-result }}
      name: Qiskit
      upstream-repository: Qiskit/qiskit
    permissions:
      issues: write # Needed to create/update issues
