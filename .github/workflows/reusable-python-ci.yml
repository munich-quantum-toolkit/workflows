name: 🐍 • CI

on:
  workflow_call:
    inputs:
      ###---- General inputs ----------------------------------------------------------------------------------------###
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      ###---- Runner configuration ----------------------------------------------------------------------------------###
      ### Supports any combination of:
      ### - Ubuntu: ubuntu-24.04, ubuntu-22.04, ubuntu-24.04-arm, ubuntu-22.04-arm
      ### - macOS: macos-13, macos-14, macos-15
      ### - Windows: windows-2022, windows-2025, windows-11-arm
      ###------------------------------------------------------------------------------------------------------------###
      runners:
        description: "List of runners to test on (e.g., 'ubuntu-24.04', 'macos-13', 'windows-2022')"
        default: '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-13", "macos-14", "windows-2022"]'
        type: string

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - id: build-matrix
        name: Build runner matrix
        run: |
          matrix='[]'

          # Parse input array
          runners='${{ inputs.runners }}'

          # Build matrix from runners array
          for runner in $(echo $runners | jq -r '.[]'); do
            matrix=$(echo $matrix | jq --arg runner "$runner" '. += [{"runs-on": $runner}]')
          done

          echo "matrix=$(echo $matrix | jq -rc .)" >> $GITHUB_OUTPUT
          echo "Generated matrix: $(echo $matrix | jq -rc .)"

  python-tests:
    needs: [build-matrix]
    name: 🐍 ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    uses: ./.github/workflows/reusable-python-tests.yml
    with:
      runs-on: ${{ matrix.runs-on }}
      setup-z3: ${{ inputs.setup-z3 }}
      z3-version: ${{ inputs.z3-version }}

  python-coverage-upload:
    name: 📈
    needs: [python-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for the `actions/checkout` action
      id-token: write # Required for the `codecov/codecov-action` action
    steps:
      # check out the repository (mostly for the codecov config)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      # download coverage reports from all jobs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          path: coverage-reports
          merge-multiple: true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5
        with:
          fail_ci_if_error: true
          flags: python
          use_oidc: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
