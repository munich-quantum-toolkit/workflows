name: 🐍 • Packaging

on:
  workflow_call:
    inputs:
      build-wheel:
        description: Build a wheel from the source distribution. Disable when cibuildwheel builds the wheels.
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-python-packaging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 📦 Python distributions
    runs-on: ${{ inputs.build-wheel && 'ubuntu-latest' || 'ubuntu-slim' }}
    steps:
      # check out the repository (including submodules and all history)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
      # set up uv for faster Python package management
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Only the Python tests save the shared uv cache key.
          save-cache: false
          prune-cache: true
      - name: Build source distribution and wheel
        if: inputs.build-wheel
        run: uv build
      - name: Build source distribution
        if: ${{ !inputs.build-wheel }}
        run: uv build --sdist
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Upload source distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && 'dev-' || '' }}cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
      - name: Upload wheel
        if: inputs.build-wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && 'dev-' || '' }}cibw-wheel
          path: dist/*.whl
          if-no-files-found: error
