name: Templating
on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/templating.yml"
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render-template:
    name: Render template
    runs-on: ubuntu-slim
    environment: mqt-app
    permissions:
      contents: write # Needed to push changes to the repository
      pull-requests: write # Needed to create a PR
    steps:
      - id: create-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: munich-quantum-toolkit/templates@93e56d3f8ad374d6bef4e57591a02bb5c6c03675 # v1.5.3
        with:
          token: ${{ steps.create-token.outputs.token }}
          name: Reusable Workflows
          organization: ${{ github.repository_owner }}
          project-type: other
          repository: ${{ github.event.repository.name }}
          synchronize-contribution-guide: false
          synchronize-documentation-utilities: false
          synchronize-installation-guide: false
