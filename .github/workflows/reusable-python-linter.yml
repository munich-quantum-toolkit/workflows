name: 🐍 • Lint
on:
  workflow_call:
    inputs:
      enable-ty:
        description: "Whether to enable Astral's ty for type checking"
        default: false
        type: boolean
      enable-mypy:
        description: "Whether to enable mypy for type checking"
        default: true
        type: boolean
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      setup-mlir:
        description: "Whether to set up MLIR"
        default: false
        type: boolean
      llvm-version:
        description: "The LLVM version to set up (formatted as 'major.minor.patch') or commit hash (minimum 7 characters, e.g., 'a832a52')"
        default: "21.1.7"
        type: string

jobs:
  lint:
    name: 🚨 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Z3
        if: ${{ inputs.setup-z3 }}
        uses: cda-tum/setup-z3@edb99468071192a5a4e2c4dbdb15f74a9df11d09 # v1.7.0
        with:
          version: ${{ inputs.z3-version }}

      - name: Set up MLIR
        if: ${{ inputs.setup-mlir }}
        uses: munich-quantum-software/setup-mlir@654d00363ef6c954da951d794e93d27fff12184d # 2025.12.12
        with:
          llvm-version: ${{ inputs.llvm-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5
        with:
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      # run mypy for static type checking
      - name: Run mypy
        if: ${{ inputs.enable-mypy }}
        run: uvx prek run -a mypy

      # run ty for type checking
      - name: Run ty
        if: ${{ inputs.enable-ty }}
        run: |
          uv sync --no-install-project
          uv run --no-sync ty check

      # run check-sdist to ensure the package sdist is correct
      - name: Run check-sdist
        run: uvx check-sdist --inject-junk
