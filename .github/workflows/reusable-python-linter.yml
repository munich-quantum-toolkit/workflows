name: 🐍 • Lint
on:
  workflow_call:
    inputs:
      enable-ty:
        description: "Whether to enable Astral's ty for type checking"
        default: false
        type: boolean
      enable-mypy:
        description: "Whether to enable mypy for type checking"
        default: true
        type: boolean
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string

jobs:
  lint:
    name: 🚨 Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # check out the repository (including submodules and all history)
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: recursive
          fetch-depth: 0
      # optionally set up Z3
      - if: ${{ inputs.setup-z3 }}
        name: Setup Z3
        uses: cda-tum/setup-z3@4bc179e7fc1cd1a7f5f13429246c692041b19eb3 # v1
        with:
          version: ${{ inputs.z3-version }}
      # set up uv for faster Python package management
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@4959332f0f014c5280e7eac8b70c90cb574c9f9b # v6.6.0
      # run mypy for static type checking
      - name: Run mypy
        if: ${{ inputs.enable-mypy }}
        run: uvx --with pre-commit-uv pre-commit run -a mypy
      # run ty for type checking
      - name: Run ty
        if: ${{ inputs.enable-ty }}
        run: uvx ty check
      # run check-sdist to ensure the package sdist is correct
      - name: Run check-sdist
        run: uvx check-sdist --inject-junk
