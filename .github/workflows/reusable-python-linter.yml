name: 🐍 • Lint
on:
  workflow_call:
    inputs:
      enable-ty:
        description: "Whether to enable Astral's ty for type checking"
        default: false
        type: boolean
      enable-mypy:
        description: "Whether to enable mypy for type checking"
        default: true
        type: boolean
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      setup-mlir:
        description: "Whether to set up MLIR"
        default: false
        type: boolean
      llvm-version:
        description: "The LLVM version to set up (formatted as 'major.minor.patch') or commit hash (minimum 7 characters, e.g., 'a832a52')"
        default: "21.1.8"
        type: string
      check-stubs:
        description: "Whether to check if the stub files are up to date. Requires a nox session called `stubs` to exist."
        default: false
        type: boolean
    secrets:
      APP_ID:
        description: Client ID of the GitHub App used to commit regenerated stubs
        required: false
      APP_PRIVATE_KEY:
        description: Private key of the GitHub App used to commit regenerated stubs
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-python-linter
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: 🚨 Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      APP_CONFIGURED: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: true
      SCCACHE_IDLE_TIMEOUT: 0
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      IQM_TOKEN: ${{ secrets.IQM_TOKEN }}
      IQM_QC_ALIAS: ${{ secrets.IQM_QC_ALIAS }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
          # Auto-fixes must be generated from the PR head, not the merge commit.
          ref: >-
            ${{ inputs.check-stubs && github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name == github.repository &&
                github.event.pull_request.head.sha || github.sha }}

      - name: Set up Z3
        if: ${{ inputs.setup-z3 }}
        uses: cda-tum/setup-z3@0401375ea1e34d77ef35bbeb634f6203f3bcde60 # v1.7.3
        with:
          version: ${{ inputs.z3-version }}

      - name: Set up MLIR
        if: ${{ inputs.setup-mlir }}
        uses: munich-quantum-software/setup-mlir@3f32263ce571a8b745068980f30f188b6e800763 # v1.4.2
        with:
          llvm-version: ${{ inputs.llvm-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up sccache
        if: ${{ inputs.check-stubs }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Check if stub files are up to date
        id: stubs
        if: ${{ inputs.check-stubs }}
        shell: bash
        run: |
          uvx nox -s stubs
          if [[ $(git status --porcelain python) ]]; then
            git add --all -- python
            echo "outdated=true" >> "$GITHUB_OUTPUT"
            echo "Stub files are not up to date. Please run 'nox -s stubs' and commit the changes."
            git --no-pager diff --cached -- python
            exit 1
          fi

      - name: Create stub auto-fix token
        id: create-token
        if: >-
          failure() && steps.stubs.outputs.outdated == 'true' && env.APP_CONFIGURED == 'true' &&
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref != github.event.repository.default_branch
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Commit regenerated stubs
        if: ${{ failure() && steps.create-token.outputs.token != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ steps.create-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --cached --quiet -- ':(glob)python/**/*.pyi' && exit 0
          PR_STATE="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.state + ":" + .head.sha')"
          if [[ "$PR_STATE" != "open:$HEAD_SHA" ]]; then
            echo "The pull request changed or closed; skipping the stale fix."
            exit 0
          fi
          # Commit the local stub changes through the API so GitHub signs the App commit.
          git diff --cached --no-renames --name-status -z -- ':(glob)python/**/*.pyi' |
            while IFS= read -r -d '' status && IFS= read -r -d '' file; do
              if [[ "$status" == D ]]; then
                jq -n --arg path "$file" '{deletions: {path: $path}}'
              else
                git show ":$file" | base64 | jq -Rs --arg path "$file" \
                  '{additions: {path: $path, contents: gsub("\n"; "")}}'
              fi
            done | jq -s --arg repository "$GH_REPO" --arg branch "$BRANCH_NAME" --arg oid "$HEAD_SHA" '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repository, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: "🐍 Regenerate Python stubs"},
                fileChanges: {additions: map(.additions // empty), deletions: map(.deletions // empty)}
              }}
            }' > "$RUNNER_TEMP/stub-commit.json"
          gh api graphql --input "$RUNNER_TEMP/stub-commit.json"

      # run mypy for static type checking
      - name: Run mypy
        if: ${{ inputs.enable-mypy }}
        run: uvx prek run -a mypy

      # run ty for type checking
      - name: Run ty
        if: ${{ inputs.enable-ty }}
        run: uvx prek run -a ty

      # run check-sdist to ensure the package sdist is correct
      - name: Run check-sdist
        run: uvx check-sdist --inject-junk

      - name: Verify sccache use
        if: ${{ inputs.check-stubs }}
        run: |
          sccache --show-stats --stats-format json |
            python -c 'import json, sys; assert json.load(sys.stdin)["stats"]["compile_requests"] > 0'
