name: 🐍 • Lint
on:
  workflow_call:
    inputs:
      enable-ty:
        description: "Whether to enable Astral's ty for type checking"
        default: false
        type: boolean
      enable-mypy:
        description: "Whether to enable mypy for type checking"
        default: true
        type: boolean
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      setup-mlir:
        description: "Whether to set up MLIR"
        default: false
        type: boolean
      llvm-version:
        description: "The LLVM version to set up (formatted as 'major.minor.patch') or commit hash (minimum 7 characters, e.g., 'a832a52')"
        default: "21.1.8"
        type: string
      check-stubs:
        description: "Whether to check if the stub files are up to date. Requires a nox session called `stubs` to exist."
        default: false
        type: boolean
      autofix-stubs:
        description: "Whether to commit outdated stubs to same-repository pull requests using the MQT App. Requires check-stubs."
        default: true
        type: boolean
    secrets:
      APP_ID:
        description: ID of the GitHub App used to commit regenerated stubs
        required: false
      APP_PRIVATE_KEY:
        description: Private key of the GitHub App used to commit regenerated stubs
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-python-linter
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: 🚨 Lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      stubs-artifact-id: ${{ steps.upload-stubs.outputs.artifact-id }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      SCCACHE_GHA_ENABLED: true
      SCCACHE_IDLE_TIMEOUT: 0
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      IQM_TOKEN: ${{ secrets.IQM_TOKEN }}
      IQM_QC_ALIAS: ${{ secrets.IQM_QC_ALIAS }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
          # Auto-fixes must be generated from the PR head, not the merge commit.
          ref: >-
            ${{ inputs.check-stubs && inputs.autofix-stubs && github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name == github.repository &&
                github.event.pull_request.head.sha || github.sha }}

      - name: Set up Z3
        if: ${{ inputs.setup-z3 }}
        uses: cda-tum/setup-z3@0401375ea1e34d77ef35bbeb634f6203f3bcde60 # v1.7.3
        with:
          version: ${{ inputs.z3-version }}

      - name: Set up MLIR
        if: ${{ inputs.setup-mlir }}
        uses: munich-quantum-software/setup-mlir@3f32263ce571a8b745068980f30f188b6e800763 # v1.4.2
        with:
          llvm-version: ${{ inputs.llvm-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up sccache
        if: ${{ inputs.check-stubs }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Check if stub files are up to date
        id: stubs
        if: ${{ inputs.check-stubs }}
        shell: bash
        run: |
          uvx nox -s stubs
          if [[ $(git status --porcelain python) ]]; then
            git add --all -- python
            git diff --cached --no-renames --name-status -z -- ':(glob)python/**/*.pyi' |
              while IFS= read -r -d '' status && IFS= read -r -d '' file; do
                if [[ "$status" == D ]]; then
                  jq -n --arg path "$file" '{deletions: {path: $path}}'
                else
                  git show ":$file" | base64 | jq -Rs --arg path "$file" \
                    '{additions: {path: $path, contents: gsub("\n"; "")}}'
                fi
              done | jq -s '{additions: map(.additions // empty), deletions: map(.deletions // empty)}' \
                > "$RUNNER_TEMP/stubs.json"
            echo "outdated=true" >> "$GITHUB_OUTPUT"
            echo "Stub files are not up to date. Please run 'nox -s stubs' and commit the changes."
            git --no-pager diff --cached -- python
            exit 1
          fi

      - name: Upload regenerated stubs
        id: upload-stubs
        if: >-
          failure() && steps.stubs.outputs.outdated == 'true' && inputs.autofix-stubs &&
          github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-stubs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stubs.json
          if-no-files-found: error
          retention-days: 1

      # run mypy for static type checking
      - name: Run mypy
        if: ${{ inputs.enable-mypy }}
        run: uvx prek run -a mypy

      # run ty for type checking
      - name: Run ty
        if: ${{ inputs.enable-ty }}
        run: uvx prek run -a ty

      # run check-sdist to ensure the package sdist is correct
      - name: Run check-sdist
        run: uvx check-sdist --inject-junk

      - name: Verify sccache use
        if: ${{ inputs.check-stubs }}
        run: |
          sccache --show-stats --stats-format json |
            python -c 'import json, sys; assert json.load(sys.stdin)["stats"]["compile_requests"] > 0'

  autofix-stubs:
    name: 🐍 Fix stubs
    needs: lint
    if: >-
      failure() && !cancelled() && inputs.check-stubs && inputs.autofix-stubs &&
      needs.lint.outputs.stubs-artifact-id != '' && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-slim
    timeout-minutes: 5
    environment: mqt-app
    env:
      APP_CONFIGURED: ${{ secrets.APP_ID != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      # Never check out or execute project code with App credentials.
      - name: Download regenerated stubs
        if: env.APP_CONFIGURED == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.lint.outputs.stubs-artifact-id }}
          path: ${{ runner.temp }}/stubs
          merge-multiple: true

      - id: create-token
        if: env.APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Commit regenerated stubs
        if: env.APP_CONFIGURED == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.create-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.number }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Validate the artifact before using the App token to commit its contents.
          jq -e 'all(.additions[], .deletions[]; .path |
            startswith("python/") and endswith(".pyi") and (contains("\\") | not) and
            (split("/") | all(. != "" and . != "." and . != "..")))' "$RUNNER_TEMP/stubs/stubs.json" >/dev/null
          jq -e '.additions + .deletions | length > 0' "$RUNNER_TEMP/stubs/stubs.json" >/dev/null || exit 0
          PR_STATE="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.state + ":" + .head.sha')"
          if [[ "$PR_STATE" != "open:$HEAD_SHA" ]]; then
            echo "The pull request changed or closed; skipping the stale fix."
            exit 0
          fi
          # GitHub signs the App commit; expectedHeadOid rejects concurrent pushes.
          jq --arg repository "$GH_REPO" --arg branch "$BRANCH_NAME" --arg oid "$HEAD_SHA" '{
            query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
            variables: {input: {
              branch: {repositoryNameWithOwner: $repository, branchName: $branch},
              expectedHeadOid: $oid,
              message: {headline: "🐍 Regenerate Python stubs"},
              fileChanges: .
            }}
          }' "$RUNNER_TEMP/stubs/stubs.json" | gh api graphql --input -
