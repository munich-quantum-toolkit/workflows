name: 🐍 • Packaging

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-python-packaging-build
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 📦 Source distribution and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/build-sdist

      - name: Build wheel from source distribution
        run: uv build --wheel --out-dir dist dist/*.tar.gz

      - name: Check wheel metadata
        run: uvx twine check dist/*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && 'dev-' || '' }}cibw-wheel
          path: dist/*.whl
          if-no-files-found: error
