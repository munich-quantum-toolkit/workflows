name: 🇨 • Tests • macos
on:
  workflow_call:
    inputs:
      runs-on:
        description: >
          The macOS runner image to use. Defaults to 'macos-latest'.
          This can be any valid macOS runner image, such as 'macos-13', 'macos-14', or 'macos-15'.
        default: "macos-latest"
        type: string
      config:
        description: >
          The build type to use. Defaults to 'Release'.
          This can be any valid CMake build type, such as 'Debug' or 'Release'.
        default: "Release"
        type: string
      compiler:
        description: >
          The compiler to use. Defaults to 'clang'.
          This can be 'clang', `clang-XX`, or 'gcc-XX'.
          If 'clang' is selected, the default Apple Clang compiler is used.
          If 'gcc-XX' is selected, this will use `gcc-XX` from Homebrew, where XX is the version number (e.g., 'gcc-14').
          A specific version of Clang can be requested via 'clang-XX', where XX is the version number (e.g., 'clang-20').
        default: "clang"
        type: string
      cmake-args:
        description: >
          Additional arguments to pass to CMake. Defaults to an empty string.
          This can be any valid CMake argument, such as '-DBUILD_SHARED_LIBS=ON'.
        default: ""
        type: string
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      setup-mlir:
        description: "Whether to set up MLIR"
        default: false
        type: boolean
      llvm-version:
        description: "The LLVM version to set up (formatted as 'major.minor.patch') or commit hash (minimum 7 characters, e.g., 'a832a52')"
        default: "21.1.8"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-cpp-tests-${{ inputs.runs-on }}-${{ inputs.compiler }}-${{ inputs.config }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpp-tests-macos:
    name: 🍎 ${{ inputs.runs-on }} ${{ inputs.compiler }} ${{ inputs.config }}
    runs-on: ${{ inputs.runs-on }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      FORCE_COLOR: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Z3
        if: ${{ inputs.setup-z3 }}
        uses: cda-tum/setup-z3@8156b32632230f11cf9c5a50becb33d73e2fb4e5 # v1.7.1
        with:
          version: ${{ inputs.z3-version }}

      - name: Set up MLIR
        if: ${{ inputs.setup-mlir }}
        uses: munich-quantum-software/setup-mlir@d23b80bbfb2581e29dd675821ede624e3a5c332f # bump-package-version
        with:
          llvm-version: ${{ inputs.llvm-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@5a095e7a2014a4212f075830d4f7277575a9d098 # v7.3.1
        with:
          python-version: 3.13
          activate-environment: true
          enable-cache: true
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Ninja
        run: uv tool install ninja

      - name: Install lit
        if: ${{ inputs.setup-mlir }}
        run: uv pip install lit

      - name: Set up GCC
        if: ${{ startsWith(inputs.compiler, 'gcc-') }}
        env:
          COMPILER: ${{ inputs.compiler }}
        run: |
          COMPILER=$(echo "$COMPILER" | sed 's/[^a-zA-Z0-9-]//g' | tr -d '\n')
          if [[ "$COMPILER" =~ ^gcc-[0-9]+$ ]]; then
            version=$(echo "$COMPILER" | sed 's/gcc-//')
            brew install gcc@$version
            echo "CC=gcc-$version" >> $GITHUB_ENV
            echo "CXX=g++-$version" >> $GITHUB_ENV
          else
            echo "Invalid compiler specified: $COMPILER" >&2
            exit 1
          fi

      - name: Set up Clang
        if: ${{ startsWith(inputs.compiler, 'clang-') }}
        env:
          COMPILER: ${{ inputs.compiler }}
        run: |
          COMPILER=$(echo "$COMPILER" | sed 's/[^a-zA-Z0-9-]//g' | tr -d '\n')
          if [[ "$COMPILER" =~ ^clang-[0-9]+$ ]]; then
            version=$(echo "$COMPILER" | sed 's/clang-//')
            brew install llvm@$version
            SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
            echo "SDKROOT=$SDK_PATH" >> $GITHUB_ENV
            LLVM_PREFIX=$(brew --prefix llvm@$version)
            echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
            echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV
            # Link against Homebrew Clang's libc++ and unwind library to resolve symbol conflicts
            echo "LDFLAGS=$LDFLAGS -L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -lunwind" >> $GITHUB_ENV
          else
            echo "Invalid compiler specified: $COMPILER" >&2
            exit 1
          fi

      - name: Configure CMake
        env:
          CONFIG: ${{ inputs.config }}
          CMAKE_ARGS: ${{ inputs.cmake-args }}
          SETUP_MLIR: ${{ inputs.setup-mlir }}
        run: |
          LIT_ARG=""
          if [ "$SETUP_MLIR" = "true" ]; then
            LIT_ARG="-DLLVM_EXTERNAL_LIT=$(which lit)"
          fi
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=$CONFIG $CMAKE_ARGS "$LIT_ARG"

      - name: Build
        env:
          CONFIG: ${{ inputs.config }}
        run: cmake --build build --config $CONFIG

      - name: Test
        env:
          CONFIG: ${{ inputs.config }}
        run: ctest -C $CONFIG --output-on-failure --test-dir build --repeat until-pass:3 --timeout 600
