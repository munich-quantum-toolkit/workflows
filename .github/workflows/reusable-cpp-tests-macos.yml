name: 🇨 • Tests • macos
on:
  workflow_call:
    inputs:
      runs-on:
        description: >
          The macOS runner image to use. Defaults to 'macos-latest'.
          This can be any valid macOS runner image, such as 'macos-15' or 'macos-26'.
        default: "macos-latest"
        type: string
      run-on-draft:
        description: "Whether to run the tests for draft pull requests"
        default: true
        type: boolean
      compiler:
        description: >
          The compiler to use. Defaults to 'clang'.
          This can be 'clang', `clang-XX`, or 'gcc-XX'.
          If 'clang' is selected, the default Apple Clang compiler is used.
          If 'gcc-XX' is selected, this will use `gcc-XX` from Homebrew, where XX is the version number (e.g., 'gcc-14').
          A specific version of Clang can be requested via 'clang-XX', where XX is the version number (e.g., 'clang-20').
        default: "clang"
        type: string
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      setup-mlir:
        description: "Whether to set up MLIR"
        default: false
        type: boolean
      mlir-assertions:
        description: "Whether the MLIR SDK should retain assertions"
        default: true
        type: boolean
      llvm-version:
        description: "The LLVM version to set up (formatted as 'major.minor.patch') or commit hash (minimum 7 characters, e.g., 'a832a52')"
        default: "21.1.8"
        type: string
      preset-name:
        description: "The CMake preset to use for configuration and build"
        required: true
        type: string
      use-sccache-gha:
        description: "Whether to use sccache with the GitHub Actions cache backend"
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-cpp-tests-${{ inputs.runs-on }}-${{ inputs.compiler }}-${{ inputs.preset-name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpp-tests-macos:
    if: ${{ !github.event.pull_request.draft || inputs.run-on-draft }}
    name: 🍎 ${{ inputs.runs-on }} ${{ inputs.compiler }} ${{ inputs.preset-name }}
    runs-on: ${{ inputs.runs-on }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      FORCE_COLOR: 3
      SCCACHE_GHA_ENABLED: ${{ inputs.use-sccache-gha }}
      SCCACHE_IDLE_TIMEOUT: 0
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
      IQM_TOKEN: ${{ secrets.IQM_TOKEN }}
      IQM_QC_ALIAS: ${{ secrets.IQM_QC_ALIAS }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Z3
        if: ${{ inputs.setup-z3 }}
        uses: cda-tum/setup-z3@0401375ea1e34d77ef35bbeb634f6203f3bcde60 # v1.7.3
        with:
          version: ${{ inputs.z3-version }}

      - name: Set up MLIR
        if: ${{ inputs.setup-mlir }}
        uses: munich-quantum-software/setup-mlir@ed5b604a5540aad8dd5deb19f50745cced8a43e4
        with:
          llvm-version: ${{ inputs.llvm-version }}
          assertions: ${{ inputs.mlir-assertions }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: 3.13
          activate-environment: true
          enable-cache: false

      - name: Install Ninja
        run: uv tool install ninja

      - name: Set up sccache
        if: ${{ inputs.use-sccache-gha }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install lit
        if: ${{ inputs.setup-mlir }}
        run: |
          uv pip install lit
          echo "LIT_BIN=$(which lit)" >> $GITHUB_ENV

      - name: Set up GCC
        if: ${{ startsWith(inputs.compiler, 'gcc-') }}
        env:
          COMPILER: ${{ inputs.compiler }}
        run: |
          COMPILER=$(echo "$COMPILER" | sed 's/[^a-zA-Z0-9-]//g' | tr -d '\n')
          if [[ "$COMPILER" =~ ^gcc-[0-9]+$ ]]; then
            version=$(echo "$COMPILER" | sed 's/gcc-//')
            brew install gcc@$version
            echo "CC=gcc-$version" >> $GITHUB_ENV
            echo "CXX=g++-$version" >> $GITHUB_ENV
          else
            echo "Invalid compiler specified: $COMPILER" >&2
            exit 1
          fi

      - name: Set up Clang
        if: ${{ startsWith(inputs.compiler, 'clang-') }}
        env:
          COMPILER: ${{ inputs.compiler }}
        run: |
          COMPILER=$(echo "$COMPILER" | sed 's/[^a-zA-Z0-9-]//g' | tr -d '\n')
          if [[ "$COMPILER" =~ ^clang-[0-9]+$ ]]; then
            version=$(echo "$COMPILER" | sed 's/clang-//')
            brew install llvm@$version
            SDK_PATH=$(xcrun --sdk macosx --show-sdk-path)
            echo "SDKROOT=$SDK_PATH" >> $GITHUB_ENV
            LLVM_PREFIX=$(brew --prefix llvm@$version)
            echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
            echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV
            # Link against Homebrew Clang's libc++ and unwind library to resolve symbol conflicts
            echo "LDFLAGS=$LDFLAGS -L$LLVM_PREFIX/lib/c++ -L$LLVM_PREFIX/lib/unwind -lunwind" >> $GITHUB_ENV
          else
            echo "Invalid compiler specified: $COMPILER" >&2
            exit 1
          fi

      - name: Configure CMake
        env:
          PRESET_NAME: ${{ inputs.preset-name }}
          USE_SCCACHE_GHA: ${{ inputs.use-sccache-gha }}
        run: |
          args=()
          if [[ "$USE_SCCACHE_GHA" == "true" ]]; then
            args+=(-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache)
          fi
          cmake --preset "$PRESET_NAME" "${args[@]}"

      - name: Build
        env:
          PRESET_NAME: ${{ inputs.preset-name }}
        run: cmake --build --preset "$PRESET_NAME"

      - name: Test
        env:
          PRESET_NAME: ${{ inputs.preset-name }}
        run: ctest --preset "$PRESET_NAME"

      - name: Verify sccache use
        if: ${{ inputs.use-sccache-gha }}
        run: |
          sccache --show-stats --stats-format json |
            python -c 'import json, sys; assert json.load(sys.stdin)["stats"]["compile_requests"] > 0'
