# The `change-detection` job determines which CI workflows to run based on the changes in a pull request or push.
# The outputs of the `change-detection` job can then be used to conditionally run other jobs in the workflow.

name: ❓ • Change Detection
on:
  workflow_call:
    inputs:
      additional-test-files:
        description: JSON array of additional inputs to the C++ and Python test suites
        type: string
        default: "[]"
      additional-cpp-files:
        description: JSON array of additional globs to check for C++-related changes
        type: string
        default: "[]"
      additional-python-files:
        description: JSON array of additional globs to check for Python-related changes
        type: string
        default: "[]"
      additional-cd-files:
        description: JSON array of additional globs to check for CD-related changes
        type: string
        default: "[]"
      additional-docs-files:
        description: JSON array of additional globs for documentation inputs
        type: string
        default: "[]"
    outputs:
      run-docs:
        description: Whether to build the documentation
        value: ${{ jobs.change-detection.outputs.run-docs }}
      run-cpp-tests:
        description: Whether to run the C++ tests
        value: ${{ jobs.change-detection.outputs.run-cpp-tests }}
      run-cpp-linter:
        description: Whether to run the C++ linter
        value: ${{ jobs.change-detection.outputs.run-cpp-linter }}
      run-python-tests:
        description: Whether to run the Python tests
        value: ${{ jobs.change-detection.outputs.run-python-tests }}
      run-python-linter:
        description: Whether to run the Python linter
        value: ${{ jobs.change-detection.outputs.run-python-linter }}
      run-cd:
        description: Whether to run the continuous deployment job
        value: ${{ jobs.change-detection.outputs.run-cd }}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-change-detection
  cancel-in-progress: true

permissions:
  pull-requests: read # List changed files, including both paths of a rename

jobs:
  change-detection:
    name: 🕵️ Check
    runs-on: ubuntu-slim
    timeout-minutes: 1
    outputs:
      run-cpp-tests: ${{ steps.paths.outputs.cpp-tests || true }}
      run-cpp-linter: ${{ steps.paths.outputs.cpp-linter || true }}
      run-python-tests: ${{ steps.paths.outputs.python-tests || true }}
      run-python-linter: ${{ steps.paths.outputs.python-linter || true }}
      run-cd: ${{ steps.paths.outputs.cd || github.event_name == 'pull_request' }}
      run-docs: ${{ steps.paths.outputs.docs || true }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: paths
        # Above GitHub's PR file limit we run all checks, including packaging.
        if: github.event_name == 'pull_request' && github.event.pull_request.changed_files > 0 && github.event.pull_request.changed_files < 3000
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            docs:
              - '{bindings,cmake,docs,include,python,src}/**'
              - '{CMakeLists.txt,CMakePresets.json}'
              - '{noxfile.py,pyproject.toml,uv.lock}'
              - '{README*,LICENSE*}'
              - '.gitmodules'
              - '.readthedocs.{yml,yaml}'
              - '.github/workflows/{ci,docs,docs-publish}.yml'
              - ${{ inputs.additional-docs-files }}
            cpp-tests:
              - &cpp-checks
                - '!test/python/**'
                - '**/CMakePresets.json'
                - '.github/workflows/ci.yml'
                - ${{ inputs.additional-cpp-files }}
              - '{cmake,include,mlir,src,test}/**'
              - &test-inputs
                - '**/CMakeLists.txt'
                - '.github/codecov.yml'
                - ${{ inputs.additional-test-files }}
            cpp-linter:
              - *cpp-checks
              # CMake also configures native sources from .in templates.
              - '{bindings,include,mlir,src,test}/**/*.{c,cc,cpp,cxx,cu,cuh,h,hh,hpp,hxx,inc,inl,ipp,tpp,def,td}?(.in)'
              - '**/.clang-tidy'
            python-tests:
              - &python-checks
                - '**/*.{py,pyi}'
                - 'python/**'
                - '**/{pyproject.toml,uv.lock}'
                - '.github/workflows/ci.yml'
                - ${{ inputs.additional-python-files }}
              - '{bindings,cmake,include,src,test/python}/**'
              - *test-inputs
            python-linter:
              - *python-checks
              - '**/.pre-commit-config.yaml'
            cd:
              - '.github/workflows/cd.yml'
              - ${{ inputs.additional-cd-files }}
