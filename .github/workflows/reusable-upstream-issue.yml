name: Upstream issue
on:
  workflow_call:
    inputs:
      tests-result:
        description: "The combined result of the upstream checks"
        required: true
        type: string
      name:
        description: "The upstream project name"
        required: true
        type: string
      upstream-repository:
        description: "The upstream repository as owner/repository"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ inputs.name }}-upstream-issue
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  create-issue:
    if: ${{ inputs.tests-result != 'success' && inputs.tests-result != 'cancelled' && github.ref == 'refs/heads/main' }}
    name: Create issue on failure
    permissions:
      contents: read
      issues: write # Needed to create/update issues
    runs-on: ubuntu-slim
    steps:
      - name: Create or update issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TEST_RESULT: ${{ inputs.tests-result }}
          UPSTREAM_NAME: ${{ inputs.name }}
          UPSTREAM_REPOSITORY: ${{ inputs.upstream-repository }}
        with:
          github-token: ${{ github.token }}
          script: |
            const name = process.env.UPSTREAM_NAME;
            const [owner, repo, extra] = process.env.UPSTREAM_REPOSITORY.split('/');
            if (!owner || !repo || extra !== undefined) {
              throw new Error('upstream-repository must be owner/repository');
            }
            const { data: commits } = await github.rest.repos.listCommits({ owner, repo, per_page: 1 });
            const commit = commits[0];
            const upstreamCommit = `${commit.html_url} (${commit.commit.author.date})`;
            const workflowRunUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issueTitle = `❌ ${name} Upstream Tests Failure`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              per_page: 100,
            });
            const matchingIssue = issues.find(issue => !issue.pull_request && issue.title === issueTitle);
            const today = new Date().toISOString().split('T')[0];
            const details = `- **Workflow run**: [View logs and details](${workflowRunUrl})
            - **Result**: \`${process.env.TEST_RESULT}\`
            - **Triggered by**: ${context.eventName}
            - **Latest ${name} commit**: ${upstreamCommit}`;
            if (matchingIssue) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: matchingIssue.number,
                body: `New ${name} failure detected on ${today}.\n\n${details}`,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: issueTitle,
                body: `## ${name} upstream tests failed on ${today}

            The weekly ${name} upstream check failed.

            ${details}

            Please investigate compatibility with the latest version of ${name}.

            > This issue was automatically generated by a GitHub Action.`,
                labels: ['bug', 'python', 'dependencies'],
              });
            }
