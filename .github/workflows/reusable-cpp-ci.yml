name: 🇨‌ • CI
on:
  workflow_call:
    inputs:
      runner:
        description: "The runner to use for the job."
        default: "ubuntu-24.04"
        type: string
      compiler:
        description: "The compiler to use for the job."
        default: "gcc"
        type: string
      config:
        description: "The build configuration to use for the job."
        default: "Release"
        type: string
      cmake-args:
        description: >
          Additional arguments to pass to CMake on every OS. Defaults to an empty string.
          This can be any valid CMake argument, such as '-DBUILD_SHARED_LIBS=ON'.
        default: ""
        type: string
      cmake-args-ubuntu:
        description: Additional arguments to pass to CMake on Ubuntu. Defaults to an empty string.
        default: ""
        type: string
      cmake-args-macos:
        description: Additional arguments to pass to CMake on macOS. Defaults to an empty string.
        default: ""
        type: string
      cmake-args-windows:
        description: Additional arguments to pass to CMake on Windows. Defaults to an empty string.
        default: ""
        type: string
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string

jobs:
  cpp-tests-ubuntu:
    if: startsWith(inputs.runner, 'ubuntu')
    name: 🐧 ${{ inputs.runner }} ${{ inputs.compiler }} ${{ inputs.config }}
    uses: ./.github/workflows/reusable-cpp-tests-ubuntu.yml
    with:
      runs-on: ${{ inputs.runner }}
      compiler: ${{ inputs.compiler }}
      config: ${{ inputs.config }}
      cmake-args: ${{ inputs.cmake-args }}
      setup-z3: ${{ inputs.setup-z3 }}
      z3-version: ${{ inputs.z3-version }}

  cpp-tests-macos:
    name: 🍎 ${{ inputs.runner }} ${{ inputs.compiler }} ${{ inputs.config }}
    if: startsWith(inputs.runner, 'macos')
    uses: ./.github/workflows/reusable-cpp-tests-macos.yml
    with:
      runs-on: ${{ inputs.runner }}
      compiler: ${{ inputs.compiler }}
      config: ${{ inputs.config }}
      cmake-args: ${{ inputs.cmake-args }}
      setup-z3: ${{ inputs.setup-z3 }}
      z3-version: ${{ inputs.z3-version }}

  cpp-tests-windows:
    name: 🏁 ${{ inputs.runner }} ${{ inputs.compiler }} ${{ inputs.config }}
    if: startsWith(inputs.runner, 'windows')
    uses: ./.github/workflows/reusable-cpp-tests-windows.yml
    with:
      runs-on: ${{ inputs.runner }}
      compiler: ${{ inputs.compiler }}
      config: ${{ inputs.config }}
      cmake-args: ${{ inputs.cmake-args }}
      setup-z3: ${{ inputs.setup-z3 }}
      z3-version: ${{ inputs.z3-version }}
