name: 🐍 • Packaging

on:
  workflow_call:
    inputs:
      runs-on:
        description: "The runner image to test on"
        default: "ubuntu-24.04"
        type: string
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      setup-mlir:
        description: "Whether to set up MLIR"
        default: false
        type: boolean
      llvm-version:
        description: "The LLVM version to set up (formatted as 'major.minor.patch') or commit hash (minimum 7 characters, e.g., 'a832a52')"
        default: "21.1.8"
        type: string
      use-sccache-gha:
        description: "Whether non-Ubuntu builds use the GitHub Actions cache backend for sccache"
        default: false
        type: boolean
    secrets:
      AWS_S3_BUCKET:
        description: "S3 bucket used by AWS-backed wheel tests"
        required: false
      AWS_ACCESS_KEY_ID:
        description: "AWS access key ID used by wheel tests"
        required: false
      AWS_SECRET_ACCESS_KEY:
        description: "AWS secret access key used by wheel tests"
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-python-packaging-cibw-${{ inputs.runs-on }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-wheel:
    name: 🎡 ${{ inputs.runs-on }}
    runs-on: ${{ inputs.runs-on }}
    env:
      SCCACHE_GHA_ENABLED: ${{ inputs.use-sccache-gha }}
      SCCACHE_GHA_VERSION: ${{ inputs.use-sccache-gha && format('{0}-{1}-llvm-{2}', github.workflow, inputs.runs-on, inputs.llvm-version) || '' }}
      SCCACHE_GHA_RW_MODE: ${{ (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && 'READ_WRITE' || 'READ_ONLY' }}
      IQM_TOKEN: ${{ secrets.IQM_TOKEN }}
      IQM_QC_ALIAS: ${{ secrets.IQM_QC_ALIAS }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Z3
        if: ${{ inputs.setup-z3 && !startsWith(inputs.runs-on, 'ubuntu') }}
        uses: cda-tum/setup-z3@0401375ea1e34d77ef35bbeb634f6203f3bcde60 # v1.7.3
        with:
          version: ${{ inputs.z3-version }}

      - name: Set up MLIR
        if: ${{ inputs.setup-mlir && !startsWith(inputs.runs-on, 'ubuntu') }}
        uses: munich-quantum-software/setup-mlir@3f32263ce571a8b745068980f30f188b6e800763 # v1.4.2
        with:
          llvm-version: ${{ inputs.llvm-version }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: ${{ !startsWith(inputs.runs-on, 'ubuntu') }}
          save-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up sccache
        if: ${{ !startsWith(inputs.runs-on, 'ubuntu') }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      # run cibuildwheel to build wheels for the specified Python version
      - uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0

      - name: Verify clean directory
        run: git diff --exit-code
        shell: bash

      # upload the wheels as an artifact (adds a `dev-` prefix for PRs)
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.event_name == 'pull_request' && 'dev-' || '' }}cibw-wheels-${{ inputs.runs-on }}
          path: wheelhouse/*.whl

      - name: Verify sccache use
        if: ${{ inputs.use-sccache-gha && !startsWith(inputs.runs-on, 'ubuntu') }}
        run: |
          "$SCCACHE_PATH" --show-stats --stats-format json |
            python -c 'import json, sys; assert json.load(sys.stdin)["stats"]["compile_requests"] > 0'
