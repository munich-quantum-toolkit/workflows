name: 🐍 • Packaging

on:
  workflow_call:
    inputs:
      runs-on:
        description: "The runner image to test on"
        default: "ubuntu-26.04"
        type: string
      use-sccache-gha:
        description: "Whether macOS and Windows builds use sccache with the GitHub Actions cache backend and must compile through sccache"
        default: false
        type: boolean
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      setup-mlir:
        description: "Install MLIR on macOS and Windows. Linux projects provision the SDK inside the wheel container."
        default: false
        type: boolean
      mlir-assertions:
        description: "Enable assertions in the SDK installed by setup-mlir"
        default: false
        type: boolean
      llvm-version:
        description: "The LLVM version to set up (formatted as 'major.minor.patch') or commit hash (minimum 7 characters, e.g., 'a832a52')"
        default: "23.1.2"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-python-packaging-cibw-${{ inputs.runs-on }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-wheel:
    name: 🎡 ${{ inputs.runs-on }}
    runs-on: ${{ inputs.runs-on }}
    env:
      SCCACHE_GHA_ENABLED: ${{ inputs.use-sccache-gha }}
      SCCACHE_IDLE_TIMEOUT: 0
      SCCACHE_SKIP_CACHE_CHECK: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - name: Set up MSVC
        if: ${{ runner.os == 'Windows' }}
        uses: $/.github/actions/setup-msvc

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Windows builds
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Visual Studio generators ignore CMake compiler launchers such as sccache.
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          # Keep wheel environments on the same drive as the uv cache for hard links.
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Set up Z3
        if: ${{ inputs.setup-z3 && runner.os != 'Linux' }}
        uses: cda-tum/setup-z3@0401375ea1e34d77ef35bbeb634f6203f3bcde60 # v1.7.3
        with:
          version: ${{ inputs.z3-version }}

      - name: Set up MLIR
        if: ${{ inputs.setup-mlir && runner.os != 'Linux' }}
        uses: munich-quantum-software/setup-mlir@8d3eae73d0f0196fd30c787d91ebd2018cb6c709 # v1.5.0
        with:
          llvm-version: ${{ inputs.llvm-version }}
          assertions: ${{ inputs.mlir-assertions }}

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: ${{ runner.os != 'Linux' }}
          # Only the Python tests save the shared uv cache key.
          save-cache: false
          prune-cache: true

      - name: Configure local and GitHub compiler caches
        if: inputs.use-sccache-gha && runner.os != 'Linux'
        shell: bash
        run: |
          echo "SCCACHE_DIR=$RUNNER_TEMP/sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_MULTILEVEL_CHAIN=disk,gha" >> "$GITHUB_ENV"

      - name: Set up sccache
        if: ${{ runner.os != 'Linux' }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # run cibuildwheel to build wheels for the specified Python version
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5

      # Linux wheels are built in containers with their own sccache instance
      - name: Verify sccache use
        if: ${{ runner.os != 'Linux' && inputs.use-sccache-gha }}
        uses: $/.github/actions/verify-sccache

      - name: Verify clean directory
        run: git diff --exit-code
        shell: bash

      # upload the wheels as an artifact (adds a `dev-` prefix for PRs)
      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && 'dev-' || '' }}cibw-wheels-${{ inputs.runs-on }}
          path: wheelhouse/*.whl
