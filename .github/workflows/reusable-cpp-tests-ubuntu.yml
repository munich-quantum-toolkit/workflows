name: 🇨 • Tests • Ubuntu
on:
  workflow_call:
    inputs:
      fetch-depth:
        description: "Number of commits to fetch. Use 0 for full history and tags."
        default: 1
        type: number
      apt-packages:
        description: "Whitespace-separated additional APT packages to install"
        default: ""
        type: string
      runs-on:
        description: >
          The Ubuntu runner image to use. Defaults to 'ubuntu-26.04'.
          This can be any valid Ubuntu runner image, such as 'ubuntu-26.04' or its ARM variant 'ubuntu-26.04-arm'.
        default: "ubuntu-26.04"
        type: string
      run-on-draft:
        description: "Whether to run the tests for draft pull requests"
        default: true
        type: boolean
      clang-version:
        description: "Clang major version to set up. Omit to skip Clang setup."
        type: number
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      setup-mlir:
        description: "Whether to set up MLIR"
        default: false
        type: boolean
      llvm-version:
        description: "The LLVM version to set up (formatted as 'major.minor.patch') or commit hash (minimum 7 characters, e.g., 'a832a52')"
        default: "23.1.2"
        type: string
      preset-name:
        description: "The CMake preset to use for configuration and build"
        required: true
        type: string
      use-sccache-gha:
        description: "Whether to use sccache with the GitHub Actions cache backend"
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-cpp-tests-${{ inputs.runs-on }}-${{ inputs.clang-version }}-${{ inputs.preset-name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpp-tests-ubuntu:
    if: ${{ !github.event.pull_request.draft || inputs.run-on-draft }}
    name: 🐧 ${{ inputs.runs-on }} ${{ inputs.preset-name }}${{ inputs.clang-version && format(' (Clang {0})', inputs.clang-version) || '' }}
    runs-on: ${{ inputs.runs-on }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      FORCE_COLOR: 3
      SCCACHE_GHA_ENABLED: ${{ inputs.use-sccache-gha }}
      SCCACHE_IDLE_TIMEOUT: 0
      # Cache availability must not prevent the compiler from running.
      SCCACHE_SKIP_CACHE_CHECK: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.ref == 'refs/heads/main' && 'READ_WRITE' || 'READ_ONLY' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false

      - name: Install additional APT packages
        if: ${{ inputs.apt-packages != '' }}
        uses: $/.github/actions/install-apt-packages
        with:
          packages: ${{ inputs.apt-packages }}

      - name: Set up Z3
        if: ${{ inputs.setup-z3 }}
        uses: cda-tum/setup-z3@0401375ea1e34d77ef35bbeb634f6203f3bcde60 # v1.7.3
        with:
          version: ${{ inputs.z3-version }}

      - name: Set up MLIR
        if: ${{ inputs.setup-mlir }}
        uses: munich-quantum-software/setup-mlir@1f96f72c996c013f34264af39c131d2bf9487d19 # v1.6.0
        with:
          llvm-version: ${{ inputs.llvm-version }}

      - name: Set up mold as linker
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038 # v1

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: 3.13
          activate-environment: true
          enable-cache: false

      - name: Install Ninja
        run: uv tool install ninja

      - name: Set up sccache
        if: ${{ inputs.use-sccache-gha }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install lit
        if: ${{ inputs.setup-mlir }}
        run: |
          uv pip install lit
          echo "LIT_BIN=$(which lit)" >> $GITHUB_ENV

      - name: Set up Clang ${{ inputs.clang-version }}
        if: ${{ inputs.clang-version != 0 }}
        uses: $/.github/actions/setup-clang
        with:
          clang-version: ${{ inputs.clang-version }}

      - name: Configure CMake
        env:
          PRESET_NAME: ${{ inputs.preset-name }}
          USE_SCCACHE_GHA: ${{ inputs.use-sccache-gha }}
        run: |
          args=()
          if [[ "$USE_SCCACHE_GHA" == "true" ]]; then
            args+=(-DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache)
          fi
          cmake --preset "$PRESET_NAME" "${args[@]}"

      - name: Build
        env:
          PRESET_NAME: ${{ inputs.preset-name }}
        run: cmake --build --preset "$PRESET_NAME"

      - name: Test
        env:
          PRESET_NAME: ${{ inputs.preset-name }}
        run: ctest --preset "$PRESET_NAME"

      - name: Verify sccache use
        if: ${{ inputs.use-sccache-gha }}
        uses: $/.github/actions/verify-sccache
