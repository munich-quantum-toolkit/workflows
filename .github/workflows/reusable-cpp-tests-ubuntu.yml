name: 🇨 • Tests • Ubuntu
on:
  workflow_call:
    inputs:
      runs-on:
        description: >
          The Ubuntu runner image to use. Defaults to 'ubuntu-24.04'.
          This can be any valid Ubuntu runner image, such as 'ubuntu-24.04' or its ARM variant 'ubuntu-24.04-arm'.
        default: "ubuntu-24.04"
        type: string
      compiler:
        description: >
          The compiler to use. Defaults to 'gcc'.
          This can be 'gcc', 'clang', or 'clang-XX'.
          If 'gcc' is selected, this will use the default GCC compiler.
          If 'clang' is selected, the default Clang compiler will be used.
          A specific version of Clang can be requested via 'clang-XX', where XX is the version number (e.g., 'clang-20').
        default: "gcc"
        type: string
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      setup-mlir:
        description: "Whether to set up MLIR"
        default: false
        type: boolean
      llvm-version:
        description: "The LLVM version to set up (formatted as 'major.minor.patch') or commit hash (minimum 7 characters, e.g., 'a832a52')"
        default: "21.1.8"
        type: string
      preset-name:
        description: "The CMake preset to use for configuration and build"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-cpp-tests-${{ inputs.runs-on }}-${{ inputs.compiler }}-${{ inputs.preset-name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpp-tests-ubuntu:
    name: 🐧 ${{ inputs.runs-on }} ${{ inputs.compiler }} ${{ inputs.preset-name }}
    runs-on: ${{ inputs.runs-on }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      FORCE_COLOR: 3
      IQM_TOKEN: ${{ secrets.IQM_TOKEN }}
      IQM_QC_ALIAS: ${{ secrets.IQM_QC_ALIAS }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Z3
        if: ${{ inputs.setup-z3 }}
        uses: cda-tum/setup-z3@7bfe87519f27304460db44284cb8cc59f50f5fc9 # v1.7.2
        with:
          version: ${{ inputs.z3-version }}

      - name: Set up MLIR
        if: ${{ inputs.setup-mlir }}
        uses: munich-quantum-software/setup-mlir@fc08baf0a172e98008e6528d465de3b5dd99bc68 # v1.4.1
        with:
          llvm-version: ${{ inputs.llvm-version }}

      - name: Set up mold as linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: 3.13
          activate-environment: true
          enable-cache: false

      - name: Install Ninja
        run: uv tool install ninja

      - name: Install lit
        if: ${{ inputs.setup-mlir }}
        run: |
          uv pip install lit
          echo "LIT_BIN=$(which lit)" >> $GITHUB_ENV

      - name: Set up default Clang
        if: ${{ inputs.compiler == 'clang' }}
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Set up specified Clang
        if: ${{ startsWith(inputs.compiler, 'clang-') }}
        env:
          COMPILER: ${{ inputs.compiler }}
          TEMP_DIR: ${{ runner.temp }}
        run: |
          # Extract version from compiler input in the form 'clang-<version>'
          if [[ "$COMPILER" =~ ^clang-([0-9]+(\.[0-9]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Error: Compiler input '$COMPILER' is not in the expected format 'clang-<version>' (numeric version only)."
            exit 1
          fi
          sudo apt-get update
          wget https://apt.llvm.org/llvm.sh -O "$TEMP_DIR/llvm_install.sh"
          chmod +x "$TEMP_DIR/llvm_install.sh"
          if sudo "$TEMP_DIR/llvm_install.sh" "$version"; then
            sudo apt-get install -y clang-$version \
                                    clang-tools-$version \
            || exit 1
          else
            echo "Installation from script failed."
            exit 1
          fi
          # Safe environment variable assignment (version is safe due to above check)
          echo "CC=clang-$version" >> $GITHUB_ENV
          echo "CXX=clang++-$version" >> $GITHUB_ENV

      - name: Configure CMake
        env:
          PRESET_NAME: ${{ inputs.preset-name }}
        run: cmake --preset "$PRESET_NAME"

      - name: Build
        env:
          PRESET_NAME: ${{ inputs.preset-name }}
        run: cmake --build --preset "$PRESET_NAME"

      - name: Test
        env:
          PRESET_NAME: ${{ inputs.preset-name }}
        run: ctest --preset "$PRESET_NAME"
