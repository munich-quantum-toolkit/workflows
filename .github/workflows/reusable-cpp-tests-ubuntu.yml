name: 🇨 • Tests • Ubuntu
on:
  workflow_call:
    inputs:
      runs-on:
        description: >
          The Ubuntu runner image to use. Defaults to 'ubuntu-24.04'.
          This can be any valid Ubuntu runner image, such as 'ubuntu-24.04' or its ARM variant 'ubuntu-24.04-arm'.
        default: "ubuntu-24.04"
        type: string
      config:
        description: >
          The build type to use. Defaults to 'Release'.
          This can be any valid CMake build type, such as 'Debug' or 'Release'.
        default: "Release"
        type: string
      compiler:
        description: >
          The compiler to use. Defaults to 'gcc'.
          This can be 'gcc', 'clang', or 'clang-XX'.
          If 'gcc' is selected, this will use the default GCC compiler.
          If 'clang' is selected, the default Clang compiler will be used.
          A specific version of Clang can be requested via 'clang-XX', where XX is the version number (e.g., 'clang-20').
        default: "gcc"
        type: string
      cmake-args:
        description: >
          Additional arguments to pass to CMake. Defaults to an empty string.
          This can be any valid CMake argument, such as '-DBUILD_SHARED_LIBS=ON'.
        default: ""
        type: string
      setup-z3:
        description: "Whether to set up Z3"
        default: false
        type: boolean
      z3-version:
        description: "The version of Z3 to set up"
        default: "4.13.4"
        type: string
      setup-mlir:
        description: "Whether to set up MLIR"
        default: false
        type: boolean
      llvm-version:
        description: "The LLVM version to set up (formatted as 'major.minor.patch') or commit hash (minimum 7 characters, e.g., 'a832a52')"
        default: "21.1.8"
        type: string
      use-cmake-presets:
        description: "Whether to use CMake presets for configuration and build."
        default: false
        type: boolean
      preset-name:
        description: "The CMake preset to use for configuration and build."
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-cpp-tests-${{ inputs.runs-on }}-${{ inputs.compiler }}-${{ inputs.use-cmake-presets && inputs.preset-name || inputs.config }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpp-tests-ubuntu:
    name: 🐧 ${{ inputs.runs-on }} ${{ inputs.compiler }} ${{ inputs.use-cmake-presets && inputs.preset-name || inputs.config }}
    runs-on: ${{ inputs.runs-on }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      FORCE_COLOR: 3
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Z3
        if: ${{ inputs.setup-z3 }}
        uses: cda-tum/setup-z3@7bfe87519f27304460db44284cb8cc59f50f5fc9 # v1.7.2
        with:
          version: ${{ inputs.z3-version }}

      - name: Set up MLIR
        if: ${{ inputs.setup-mlir }}
        uses: munich-quantum-software/setup-mlir@f3ebc0bd966545a052741bc2b31750c34a09aa22 # v1.3.0
        with:
          llvm-version: ${{ inputs.llvm-version }}

      - name: Set up mold as linker
        uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878 # v1

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0
        with:
          python-version: 3.13
          activate-environment: true
          enable-cache: false

      - name: Install Ninja
        run: uv tool install ninja

      - name: Install lit
        if: ${{ inputs.setup-mlir }}
        run: uv pip install lit

      - name: Set up default Clang
        if: ${{ inputs.compiler == 'clang' }}
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Set up specified Clang
        if: ${{ startsWith(inputs.compiler, 'clang-') }}
        env:
          COMPILER: ${{ inputs.compiler }}
          TEMP_DIR: ${{ runner.temp }}
        run: |
          # Extract version from compiler input in the form 'clang-<version>'
          if [[ "$COMPILER" =~ ^clang-([0-9]+(\.[0-9]+)?)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Error: Compiler input '$COMPILER' is not in the expected format 'clang-<version>' (numeric version only)."
            exit 1
          fi
          sudo apt-get update
          wget https://apt.llvm.org/llvm.sh -O "$TEMP_DIR/llvm_install.sh"
          chmod +x "$TEMP_DIR/llvm_install.sh"
          if sudo "$TEMP_DIR/llvm_install.sh" "$version"; then
            sudo apt-get install -y clang-$version \
                                    clang-tools-$version \
            || exit 1
          else
            echo "Installation from script failed."
            exit 1
          fi
          # Safe environment variable assignment (version is safe due to above check)
          echo "CC=clang-$version" >> $GITHUB_ENV
          echo "CXX=clang++-$version" >> $GITHUB_ENV

      - name: Configure CMake
        if: ${{ !inputs.use-cmake-presets }}
        env:
          CONFIG: ${{ inputs.config }}
          CMAKE_ARGS: ${{ inputs.cmake-args }}
          SETUP_MLIR: ${{ inputs.setup-mlir }}
        run: |
          LIT_ARG=""
          if [ "$SETUP_MLIR" = "true" ]; then
            LIT_ARG="-DLLVM_EXTERNAL_LIT=$(which lit)"
          fi
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=$CONFIG $CMAKE_ARGS "$LIT_ARG"

      - name: Configure CMake with cmake-presets
        if: ${{ inputs.use-cmake-presets }}
        env:
          PRESET_NAME: ${{ inputs.preset-name }}
          SETUP_MLIR: ${{ inputs.setup-mlir }}
        run: |
          LIT_ARG=""
          if [ "$SETUP_MLIR" = "true" ]; then
            LIT_ARG="-DLLVM_EXTERNAL_LIT=$(which lit)"
          fi
          cmake --preset "$PRESET_NAME" "$LIT_ARG"

      - name: Build
        if: ${{ !inputs.use-cmake-presets }}
        env:
          CONFIG: ${{ inputs.config }}
        run: cmake --build build --config $CONFIG

      - name: Build with cmake-presets
        if: ${{ inputs.use-cmake-presets }}
        env:
          PRESET_NAME: ${{ inputs.preset-name }}
        run: cmake --build --preset "$PRESET_NAME"

      - name: Test
        env:
          CONFIG: ${{ inputs.config }}
        run: ctest -C $CONFIG --output-on-failure --test-dir build --repeat until-pass:3 --timeout 600
