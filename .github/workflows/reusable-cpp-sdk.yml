name: 🇨 • Packaging
on:
  workflow_call:
    inputs:
      runs-on:
        description: "The runner image to use"
        default: "ubuntu-26.04"
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-cpp-sdk-${{ inputs.runs-on }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    name: 📦 ${{ inputs.runs-on }}
    runs-on: ${{ inputs.runs-on }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      FORCE_COLOR: 3
      SDK_PLATFORM: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ github.event_name == 'pull_request' && 'dev-' || '' }}cibw-wheels-${{ inputs.runs-on }}
          path: wheelhouse

      - name: Set up MSVC
        if: ${{ runner.os == 'Windows' }}
        uses: $/.github/actions/setup-msvc

      - name: Install patchelf
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Install Ninja
        run: uv tool install ninja

      - name: Package, relocate, and test
        run: cmake -P cmake/PackageSDK.cmake

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpp-sdk-${{ inputs.runs-on }}
          path: dist/*
          if-no-files-found: error
