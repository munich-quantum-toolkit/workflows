name: ⬆️ Update MQT Core
on:
  workflow_call:
    inputs:
      update-to-head:
        description: Whether to update to the latest commit on the main branch or the latest release
        default: false
        type: boolean
        required: false
      max-major-version:
        description: Maximum supported MQT Core major version (leave empty for unrestricted updates; cannot be combined with update-to-head)
        default: ""
        type: string
        required: false
    secrets:
      APP_ID:
        description: ID of the GitHub App with permission to create and update pull requests
        required: true
      APP_PRIVATE_KEY:
        description: Private key of the GitHub App with permission to create and update pull requests
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-mqt-core-update
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update-mqt-core:
    name: ⬆️ Update MQT Core
    runs-on: ubuntu-slim
    environment: mqt-app
    permissions:
      contents: write # Needed to push changes to the repository
      pull-requests: write # Needed to create pull requests.
    steps:
      - name: Validate inputs
        id: validate-inputs
        env:
          MAX_MAJOR_VERSION: ${{ inputs.max-major-version }}
          UPDATE_TO_HEAD: ${{ inputs.update-to-head }}
        run: |
          if [[ -n "$MAX_MAJOR_VERSION" && ! "$MAX_MAJOR_VERSION" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "::error::max-major-version must be empty or a nonnegative integer."
            exit 1
          fi
          if [ -n "$MAX_MAJOR_VERSION" ] && [ "$UPDATE_TO_HEAD" = true ]; then
            echo "::error::max-major-version cannot be combined with update-to-head."
            exit 1
          fi
      # Create a GitHub App token
      - id: create-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      # Check out the repository
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # Parse the MQT Core version and the revision from the `cmake/ExternalDependencies.cmake` file.
      # The relevant portions of the file have the format:
      # ```cmake
      #   set(MQT_CORE_VERSION <major>.<minor>.<patch>\n
      #   # ...
      #   set(MQT_CORE_REV "<tag, branch or commit hash>"\n
      # ```
      # where `<major>.<minor>.<patch>` is the version and `<tag, branch or commit hash>` is the revision.
      - name: Parse MQT Core version and revision
        id: get-used-version
        run: |
          echo "Checking if cmake/ExternalDependencies.cmake exists..."
          ls -l cmake/ExternalDependencies.cmake || true
          echo "Attempting to parse version and revision..."
          version=$(sed -nE 's/set\(MQT_CORE_VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)/\1/p' cmake/ExternalDependencies.cmake)
          echo "Parsed version: $version"
          revision=$(sed -nE 's/set\(MQT_CORE_REV\s+"([^"]+)"/\1/p' cmake/ExternalDependencies.cmake)
          echo "Parsed revision: $revision"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "revision=$revision" >> $GITHUB_OUTPUT
      # Select the latest release, optionally restricted to a supported major version.
      - name: Get latest release of MQT Core
        id: get-latest-release
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_MAJOR_VERSION: ${{ inputs.max-major-version }}
        run: |
          set -euo pipefail

          if [ -z "$MAX_MAJOR_VERSION" ]; then
            echo "Querying the latest release of MQT Core..."
            latest_release=$(gh api repos/munich-quantum-toolkit/core/releases/latest)
            tag=$(jq -er '.tag_name | strings | select(test("^v?(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))' <<< "$latest_release")
          else
            echo "Querying MQT Core releases up to major version $MAX_MAJOR_VERSION..."
            releases=$(gh api --paginate --slurp 'repos/munich-quantum-toolkit/core/releases?per_page=100')
            tag=$(jq -er --argjson max "$MAX_MAJOR_VERSION" '
              if type != "array" or any(.[]; type != "array") then
                error("Expected an array of release pages")
              else add // [] end
              | if any(.[];
                  type != "object" or (.tag_name | type) != "string"
                  or (.draft | type) != "boolean" or (.prerelease | type) != "boolean") then
                  error("Malformed release response")
                else . end
              | [ .[]
                  | select(.draft == false and .prerelease == false)
                  | select(.tag_name | test("^v?(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"))
                  | . + {version: (.tag_name | ltrimstr("v") | split(".") | map(tonumber))}
                  | select(.version[0] <= $max)
                ]
              | max_by(.version) | .tag_name // ""
            ' <<< "$releases")
          fi

          if [ -z "$tag" ]; then
            echo "No eligible MQT Core release found."
            echo "release_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_version=${tag#v}
          echo "tag=$tag"
          echo "latest_version=$latest_version"
          echo "release_found=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest_version=$latest_version" >> "$GITHUB_OUTPUT"
      # Resolve the selected release tag to its commit, including for annotated tags.
      - name: Get the commit SHA of the selected MQT Core release
        if: steps.get-latest-release.outputs.release_found == 'true'
        id: get-latest-tag-sha
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST_TAG: ${{ steps.get-latest-release.outputs.tag }}
        run: |
          set -euo pipefail

          echo "Querying the commit for MQT Core tag $LATEST_TAG..."
          latest_tag_commit=$(gh api "repos/munich-quantum-toolkit/core/commits/tags/$LATEST_TAG")
          latest_tag_sha=$(jq -er '.sha | strings | select(test("^[0-9a-f]{40}$"))' <<< "$latest_tag_commit")
          echo "latest_tag_sha=$latest_tag_sha"
          echo "latest_tag_sha=$latest_tag_sha" >> "$GITHUB_OUTPUT"
      # Query the latest commit of the main branch of mqt-core via the GitHub API (using the GitHub token for authentication).
      - name: Get the latest commit of the main branch of MQT Core
        if: inputs.update-to-head && steps.get-latest-release.outputs.release_found == 'true'
        id: get-latest-commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo "Querying the latest commit of the main branch of MQT Core..."
          latest_commit=$(gh api repos/munich-quantum-toolkit/core/commits/main)
          latest_commit_sha=$(jq -er '.sha | strings | select(test("^[0-9a-f]{40}$"))' <<< "$latest_commit")
          echo "latest_commit_sha=$latest_commit_sha"
          echo "latest_commit_sha=$latest_commit_sha" >> "$GITHUB_OUTPUT"
      # Install the `semver` tool for making semantic version comparisons.
      - name: Install semver
        if: steps.get-latest-release.outputs.release_found == 'true'
        run: |
          wget -O /usr/local/bin/semver \
          https://raw.githubusercontent.com/fsaintjacques/semver-tool/master/src/semver
          chmod +x /usr/local/bin/semver
      # Compare the used version with the latest version based on SemVer.
      # Indicate to update MQT Core, whenever
      # - the user wants to update to the latest commit on the main branch and the used revision is different, or
      # - the latest version is newer than the used version, or
      # - the latest version is the same as the used version, but its tag has a different commit SHA than the used revision.
      - name: Compare versions
        if: steps.get-latest-release.outputs.release_found == 'true'
        id: compare-versions
        env:
          UPDATE_TO_HEAD: ${{ inputs.update-to-head }}
          USED_VERSION: ${{ steps.get-used-version.outputs.version }}
          USED_REVISION: ${{ steps.get-used-version.outputs.revision }}
          LATEST_VERSION: ${{ steps.get-latest-release.outputs.latest_version }}
          LATEST_TAG_SHA: ${{ steps.get-latest-tag-sha.outputs.latest_tag_sha }}
          LATEST_COMMIT_SHA: ${{ steps.get-latest-commit.outputs.latest_commit_sha }}
        run: |
          if [ "$UPDATE_TO_HEAD" = true ]; then
            if [ "$USED_REVISION" != "$LATEST_COMMIT_SHA" ]; then
              update=true
            else
              update=false
            fi
          else
            if (( $(semver compare "$USED_VERSION" "$LATEST_VERSION") < 0 )); then
              update=true
            elif [ "$USED_VERSION" = "$LATEST_VERSION" ] && [ "$USED_REVISION" != "$LATEST_TAG_SHA" ]; then
              update=true
            else
              update=false
            fi
          fi
          echo "update=$update"
          echo "update=$update" >> $GITHUB_OUTPUT
      # If an update should be performed, properly set the new version and revision based on the update type.
      # If the user wants to update to the latest commit on the main branch, set the revision to the latest commit SHA,
      # and if the latest commit SHA is different from the latest tag SHA, use the semver tool to increment the patch
      # version. Otherwise, set the version to the latest version. If the user wants to update to the latest release,
      # set the version to the latest version and the revision to the latest tag SHA.
      - name: Determine new version and revision
        if: steps.compare-versions.outputs.update == 'true'
        id: determine-new-version-and-revision
        env:
          UPDATE_TO_HEAD: ${{ inputs.update-to-head }}
          USED_VERSION: ${{ steps.get-used-version.outputs.version }}
          LATEST_VERSION: ${{ steps.get-latest-release.outputs.latest_version }}
          LATEST_TAG_SHA: ${{ steps.get-latest-tag-sha.outputs.latest_tag_sha }}
          LATEST_COMMIT_SHA: ${{ steps.get-latest-commit.outputs.latest_commit_sha }}
        run: |
          if [ "$UPDATE_TO_HEAD" = true ]; then
            if [ "$LATEST_COMMIT_SHA" != "$LATEST_TAG_SHA" ]; then
              new_version=$(semver bump patch "$USED_VERSION")
            else
              new_version="$LATEST_VERSION"
            fi
            new_revision="$LATEST_COMMIT_SHA"
          else
            new_version="$LATEST_VERSION"
            new_revision="$LATEST_TAG_SHA"
          fi
          echo "new_version=$new_version"
          echo "new_revision=$new_revision"
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          echo "new_revision=$new_revision" >> $GITHUB_OUTPUT
      # Update the MQT Core version and revision in the `cmake/ExternalDependencies.cmake` file.
      - name: Update MQT Core version and revision
        id: update-version
        if: steps.compare-versions.outputs.update == 'true'
        env:
          NEW_VERSION: ${{ steps.determine-new-version-and-revision.outputs.new_version }}
          NEW_REVISION: ${{ steps.determine-new-version-and-revision.outputs.new_revision }}
        run: |
          sed -i "s|set(MQT_CORE_VERSION.*|set(MQT_CORE_VERSION $NEW_VERSION|" cmake/ExternalDependencies.cmake
          sed -i "s|set(MQT_CORE_REV.*|set(MQT_CORE_REV \"$NEW_REVISION\"|" cmake/ExternalDependencies.cmake
          git diff
      # Create a pull request to merge the changes into the main branch.
      - name: Create pull request
        if: steps.compare-versions.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ steps.create-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          USED_VERSION: ${{ steps.get-used-version.outputs.version }}
          USED_REVISION: ${{ steps.get-used-version.outputs.revision }}
          NEW_VERSION: ${{ steps.determine-new-version-and-revision.outputs.new_version }}
          NEW_REVISION: ${{ steps.determine-new-version-and-revision.outputs.new_revision }}
        run: |
          set -euo pipefail

          BRANCH_NAME="update-mqt-core-${NEW_REVISION}"

          # Nothing to do if the update step did not change anything.
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to the MQT Core version or revision."
            exit 0
          fi

          # Build the commit on a temporary branch, so that an already open pull request
          # keeps its current commit if anything below fails.
          BASE_OID="$(git rev-parse HEAD)"
          TEMPORARY_BRANCH="$BRANCH_NAME-$RUN_ID"
          cleanup() {
            gh api --method DELETE "repos/$REPOSITORY/git/refs/heads/$TEMPORARY_BRANCH" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          gh api "repos/$REPOSITORY/git/refs" \
            --field "ref=refs/heads/$TEMPORARY_BRANCH" \
            --field "sha=$BASE_OID" >/dev/null

          # Commit through the GraphQL API so that GitHub signs the commit and attributes it
          # to the app. `--no-renames` splits a rename into a deletion and an addition, so
          # that the old path is removed rather than left behind.
          ADDITIONS="$(git diff --cached --no-renames --name-only --diff-filter=ACM |
            while IFS= read -r file; do
              jq -n --arg path "$file" \
                    --arg contents "$(base64 < "$file" | tr -d '\n')" \
                    '{path: $path, contents: $contents}'
            done | jq --slurp '.')"
          DELETIONS="$(git diff --cached --no-renames --name-only --diff-filter=D |
            jq --raw-input '{path: .}' | jq --slurp '.')"

          COMMIT_OID="$(jq -n \
            --arg repository "$REPOSITORY" \
            --arg branch "$TEMPORARY_BRANCH" \
            --arg oid "$BASE_OID" \
            --arg headline "⬆️ Update \`munich-quantum-toolkit/core\` from v${USED_VERSION} to v${NEW_VERSION}" \
            --argjson additions "$ADDITIONS" \
            --argjson deletions "$DELETIONS" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {
                input: {
                  branch: {repositoryNameWithOwner: $repository, branchName: $branch},
                  message: {headline: $headline},
                  expectedHeadOid: $oid,
                  fileChanges: {additions: $additions, deletions: $deletions}
                }
              }
            }' | gh api graphql --input - \
            --jq '.data.createCommitOnBranch.commit.oid')"

          # Only now move the pull request branch onto the new commit.
          gh api "repos/$REPOSITORY/git/refs" \
            --field "ref=refs/heads/$BRANCH_NAME" \
            --field "sha=$COMMIT_OID" >/dev/null 2>&1 ||
            gh api --method PATCH "repos/$REPOSITORY/git/refs/heads/$BRANCH_NAME" \
              --field "sha=$COMMIT_OID" --field "force=true" >/dev/null

          # Open a pull request unless one is already open for this branch.
          if [ -z "$(gh pr list --repo "$REPOSITORY" --head "$BRANCH_NAME" --base "main" --state open --json number --jq '.[].number')" ]; then
            gh pr create \
              --repo "$REPOSITORY" \
              --title "⬆️ Update \`munich-quantum-toolkit/core\` from v${USED_VERSION} to v${NEW_VERSION}" \
              --body "This pull request updates the [munich-quantum-toolkit/core](https://github.com/munich-quantum-toolkit/core) dependency from munich-quantum-toolkit/core@${USED_REVISION} (version v${USED_VERSION}) to munich-quantum-toolkit/core@${NEW_REVISION} (version v${NEW_VERSION}).

          **Full Changelog**: https://github.com/munich-quantum-toolkit/core/compare/${USED_REVISION}...${NEW_REVISION}" \
              --base "main" \
              --head "$BRANCH_NAME" \
              --label "dependencies,c++"
          fi
