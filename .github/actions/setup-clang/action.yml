name: Set up Clang
description: Select a versioned Ubuntu Clang toolchain and install any missing tools.
inputs:
  clang-version:
    description: Clang major version
    required: true
  install-lint-tools:
    description: Also install clang-format and clang-tidy
    default: "false"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        CLANG_VERSION: ${{ inputs.clang-version }}
        INSTALL_LINT_TOOLS: ${{ inputs.install-lint-tools }}
      run: bash "$GITHUB_ACTION_PATH/setup.sh"
