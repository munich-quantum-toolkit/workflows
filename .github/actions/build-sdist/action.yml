name: Build source distribution
description: Check out the project, build and check its Python source distribution, and upload it as an artifact.
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive
        fetch-depth: 0
        persist-credentials: false

    - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        # Only the Python tests save the shared uv cache key.
        save-cache: false
        prune-cache: true

    - name: Build source distribution
      shell: bash
      run: uv build --sdist --out-dir dist

    - name: Check source distribution metadata
      shell: bash
      run: uvx twine check dist/*.tar.gz

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ github.event_name == 'pull_request' && 'dev-' || '' }}cibw-sdist
        path: dist/*.tar.gz
        if-no-files-found: error
