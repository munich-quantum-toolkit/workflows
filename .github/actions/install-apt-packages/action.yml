name: Install APT packages
description: Install the caller's additional Ubuntu packages.
inputs:
  packages:
    description: Whitespace-separated APT packages
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        APT_PACKAGES: ${{ inputs.packages }}
      run: |
        read -r -a packages <<< "${APT_PACKAGES//$'\n'/ }"
        sudo apt-get update
        sudo apt-get install -y -- "${packages[@]}"
